          "gradle.properties": "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\n",
          "settings.gradle": "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\nrootProject.name = 'Sim8051'\ninclude ':app'\n",
          "tests/core.test.js": "'use strict';\nconst assert=require('node:assert/strict'),fs=require('node:fs'),path=require('node:path');\nconst {CPU8051,parseHex}=require('../app/src/main/assets/core.js');let tests=0;\nfunction test(name,f){f();tests++;console.log('PASS '+name)}\nfunction program(bytes){const c=new CPU8051();c.code.set(bytes);return c}\nfunction record(type,addr,data){const b=[data.length,addr>>8,addr&255,type,...data];return ':'+b.map(x=>x.toString(16).padStart(2,'0')).join('')+((-b.reduce((a,b)=>a+b,0))&255).toString(16).padStart(2,'0')+'\\n'}\nconst eof=record(1,0,[]);\ntest('HEX checksum, length, EOF, range and overlap validation',()=>{\n assert.equal(parseHex(record(0,0,[0x74,0xfe])+eof).code[1],254);\n assert.throws(()=>parseHex(':0200000074FE00\\n'+eof),/校验/);\n assert.throws(()=>parseHex(':0300000074FE8C\\n'+eof),/长度/);\n assert.throws(()=>parseHex(record(0,0,[0])),/EOF/);\n assert.throws(()=>parseHex(record(4,0,[0,1])+record(0,0,[1])+eof),/64KB/);\n assert.throws(()=>parseHex(record(0,0,[1])+record(0,0,[2])+eof),/冲突/);\n assert.throws(()=>parseHex(eof+record(0,0,[0])),/EOF/);\n});\ntest('Every standard opcode dispatches; reserved A5 rejected',()=>{\n for(let o=0;o<256;o++){const c=program([o,0,0]);if(o===0xa5)assert.throws(()=>c.step(),/操作码/);else assert.doesNotThrow(()=>c.step(),'opcode '+o.toString(16))}\n});\ntest('ADD/ADDC/SUBB exhaustive result, carry, auxiliary carry and signed overflow',()=>{\n const c=new CPU8051();for(let a=0;a<256;a++)for(let b=0;b<256;b++)for(let carry=0;carry<2;carry++){\n  c.a=a;c.add(b,carry);const sum=a+b+carry,sa=a<128?a:a-256,sb=b<128?b:b-256;\n  assert.equal(c.a,sum&255);assert.equal(c.c,Number(sum>255));assert.equal((c.read(0xd0)>>6)&1,Number((a&15)+(b&15)+carry>15));assert.equal((c.read(0xd0)>>2)&1,Number(sa+sb+carry>127||sa+sb+carry< -128));\n  c.a=a;c.c=carry;c.sub(b);const diff=a-b-carry;assert.equal(c.a,diff&255);assert.equal(c.c,Number(diff<0));assert.equal((c.read(0xd0)>>6)&1,Number((a&15)<(b&15)+carry));assert.equal((c.read(0xd0)>>2)&1,Number(sa-sb-carry>127||sa-sb-carry< -128));\n }\n});\ntest('Decimal adjust for all packed-BCD additions',()=>{const bcd=n=>(Math.floor(n/10)<<4)|(n%10);for(let a=0;a<100;a++)for(let b=0;b<100;b++)for(let cy=0;cy<2;cy++){const c=program([0xd4]);c.a=bcd(a);c.add(bcd(b),cy);c.step();assert.equal(c.a,bcd((a+b+cy)%100));assert.equal(c.c,Number(a+b+cy>=100));}});\ntest('Direct / indirect / register bank / bit addressing',()=>{\n const c=program([0x75,0xd0,0x08,0x78,0x30,0x76,0x55,0xe6,0xd2,0x00,0x85,0x30,0x31]);for(let i=0;i<6;i++)c.step();assert.equal(c.ram[8],0x30);assert.equal(c.ram[0x31],0x55);assert.equal(c.a,0x55);assert.equal(c.ram[0x20],1);\n c.code[0]=0x76;c.pc=0;c.wr(0,128);assert.throws(()=>c.step(),/128/);\n});\ntest('LCALL/RET stack ordering, AJMP page boundary, signed branch',()=>{\n const c=program([0x12,0,6,0x74,0x55,0,0x74,0x33,0x22]);c.step();assert.equal(c.pc,6);assert.equal(c.ram[8],3);assert.equal(c.ram[9],0);c.step();c.step();assert.equal(c.pc,3);c.step();assert.equal(c.a,0x55);\n c.pc=0x7fe;c.code[0x7fe]=1;c.code[0x7ff]=0x12;c.step();assert.equal(c.pc,0x812);\n c.pc=0;c.code.set([0x80,0xfe]);c.step();assert.equal(c.pc,0);\n});\ntest('MOVC and MOVX use distinct memory spaces',()=>{\n const c=program([0x90,0x12,0x34,0x74,0x56,0xf0,0xe4,0xe0]);for(let i=0;i<5;i++)c.step();assert.equal(c.a,0x56);assert.equal(c.xram[0x1234],0x56);assert.equal(c.code[0x1234],0);\n c.code.set([0x74,2,0x83,0,0,0xab]);c.pc=0;c.step();c.step();assert.equal(c.a,0xab);\n});\ntest('Timer modes 0/1/2 overflow and reload',()=>{\n for(let mode=0;mode<3;mode++){const c=new CPU8051();c.raw(0x89,mode);c.raw(0x88,16);c.raw(0x8c,mode===2?0xa0:255);c.raw(0x8a,255);c.tick(1);assert.ok(c.read(0x88)&32);assert.equal(c.read(0x8a),mode===2?0xa0:mode===0?0xe0:0);}\n});\ntest('Timer interrupt priority nesting and RETI',()=>{\n const c=new CPU8051();c.raw(0xa8,0x8a);c.raw(0xb8,8);c.raw(0x88,32);c.interrupt();assert.equal(c.pc,0x0b);assert.deepEqual(c.irq,[0]);c.raw(0x88,128);c.interrupt();assert.equal(c.pc,0x1b);assert.deepEqual(c.irq,[0,1]);c.code[0x1b]=0x32;c.step();assert.equal(c.pc,0x0b);assert.deepEqual(c.irq,[0]);c.code[0x0b]=0x32;c.step();assert.equal(c.pc,0);assert.deepEqual(c.irq,[]);\n});\ntest('End-to-end HEX LED sequence executes actual instructions',()=>{\n const c=new CPU8051();c.code.set(parseHex(fs.readFileSync(path.join(__dirname,'../examples/led.hex'),'utf8')).code);const seen=[];let old=255;for(let i=0;i<80000&&seen.length<8;i++){c.step();const p=c.read(0x90);if(p!==old){seen.push(p);old=p}}assert.deepEqual(seen,[254,253,251,247,239,223,191,127]);\n});\ntest('End-to-end HEX timer ISR toggles LED and returns',()=>{\n const c=new CPU8051();c.code.set(parseHex(fs.readFileSync(path.join(__dirname,'../examples/timer.hex'),'utf8')).code);for(let i=0;i<40000;i++)c.step();assert.equal(c.read(0x90),254);assert.equal(c.irq.length,0);\n});\ntest('Unsupported peripherals fail explicitly',()=>{const c=program([0x75,0x99,1]);assert.throws(()=>c.step(),/SFR/);c.raw(0x89,3);c.raw(0x88,16);assert.throws(()=>c.tick(1),/模式 3/);});\nconsole.log(`${tests} test groups passed`);\n"
        }''')
        root=Path('_sim8051_generated')
        for name, content in files.items():
