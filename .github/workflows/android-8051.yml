# Upload this ONE file to .github/workflows/android-8051.yml
name: Build 8051 Android
'on':
  workflow_dispatch: {}
  push:
    paths:
    - .github/workflows/android-8051.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Generate self-contained Android project
      run: |
        python3 - <<'PY_SOURCE'
        import json
        from pathlib import Path
        files=json.loads(r'''{
          "README.md": "# 8051 实验台 0.1（安卓验证版）\n\n## 单文件 GitHub 编译\n把交付的 `android-8051.yml` 放在仓库 `.github/workflows/android-8051.yml`。\n工作流内嵌项目全部源码，不要求另外上传 Android 工程，不需要配置 API 密钥。\n进入 Actions → Build 8051 Android → Run workflow。\n成功后在该次运行底部 Artifacts 下载 `8051-Android-debug`，解压安装 `app-debug.apk`。\n另一个产物 `8051-source-and-examples` 包含源代码、示例 HEX、Keil C51 测试源码和说明。\n仓库开启 Actions 才能运行；公开/私有仓库用量取决于你的 GitHub 账户。\n如仓库已有其他 Android 工作流，可单独运行本工作流；不需要覆盖旧项目文件。\n自动生成目录为 `_sim8051_generated`。请勿把手写源码放在这个专用目录里。\n\n## 手机上怎么验证\n1. 安装 APK（Android 8.0 及以上）。\n2. 点击“流水灯示例”→“运行”。P1.0 至 P1.7 依次点亮。\n3. 点击“定时器示例”→“运行”。P1.0 周期闪烁，其他灯灭。\n4. 暂停、单步，观察 PC、A、PSW、SP 和定时器值；复位保留程序。\n5. Keil C51 选择标准 8051，Options for Target → Output 勾选 Create HEX File，重新构建。\n6. 导入自己的 `.hex`。首个测试推荐 `examples/keil_led.c`。\n7. 选择 P0/P1/P2/P3 可以切换 LED 观察端口；LED 默认低电平点亮。\n切到后台自动暂停。关闭应用后需重新导入；本版不自动保存项目。\n\n## 已实现范围\n- 可扩展的主控选择入口，当前只有标准 8051（128 字节 IRAM、12T）。\n- 标准指令解释执行（保留码 A5 明确报错）、4 个寄存器组、位寻址。\n- 64KB 程序存储、64KB 逻辑 XRAM（MOVX）；XRAM 仅为验证方便，不模拟外部总线。\n- Intel HEX 校验和、记录长度、EOF、越界、冲突重叠检查。支持数据/EOF/段地址/线性地址记录。\n- T0/T1 内部定时模式 0/1/2，TF 标志和两级优先级定时器中断、RETI。\n- 固定 LED 数字实验板、速度选择、运行/暂停/单步/复位、寄存器及 RAM 显示。\n- Android 原生文件选择器；应用不申请联网或全盘存储权限。\n\n## 限制（避免误判兼容性）\n这是原型，不是 Labcenter Proteus 产品，也不兼容 Proteus 工程。\n未实现自由布线、模拟电路求解、UART、外部中断、外部计数、GATE、T0 模式3、低功耗模式、8052/STC 扩展外设。\n对不支持的 SFR 访问及上述部分配置明确停止报错。\n端口按逻辑锁存值显示，不模拟引脚电气特性、外部负载、读引脚与读锁存的差别。\n程序存储未写入区域填充 FF。HEX 本身不能证明目标型号匹配；用户需确认是标准 8051 代码。\n不支持 AXF、ELF、目标文件或 STM32/ARM HEX，不提供 C 源级单步调试。\n中断采样在指令边界，未实现真实芯片全部采样延迟；不是周期精确认证模型。\n速度是目标机器周期吞吐，低性能手机可能达不到设定速度。\n\n## 验证记录\n本地 Node.js：12 组测试通过，包括穷举 ADD/ADDC/SUBB 结果与标志、BCD 调整、\n所有标准操作码的派发检查、HEX 错误、寻址、调用栈、MOVC/MOVX、定时器、\n嵌套优先级中断、实际执行流水灯和定时器 HEX。\n“所有操作码派发检查”不是每条指令的穷举正确性认证。\n内置 HEX 为手工生成的 8051 机器码，不是声称由 Keil 编译的文件。\nKeil C51 示例源码尚未在本环境使用 Keil 编译，需你的实际 HEX 做兼容性验收。\n当前环境没有 Android SDK/Gradle 和可运行浏览器，尚未完成 APK 编译、手机实测、页面视觉验收。\nGitHub 工作流会重新运行内核测试，再执行 assembleDebug；构建结果以 Actions 日志为准。\n\n## 技术结构\n原生 Java Activity + 离线 WebView UI + JavaScript 指令解释器。\n本地 HTTPS 资源通过 WebViewClient 从打包 assets 提供，不访问网络。\n与真实 CPU 无关，手机不需要 root 或终端。\nGitHub：JDK17、AGP8.7.3、Gradle8.9、compile/targetSdk35、minSdk26。\nAPK 为 debug 签名，适合验证；不同构建的调试签名可能不同，若提示签名冲突需卸载旧版。\n\n## 参考规格\n- Keil 指令参考：https://www.keil.com/support/man/docs/is51/is51_instructions.asp\n- Keil HEX 格式：https://www.keil.com/support/docs/1584/_hlp_hexfile.htm\n- Android AGP 兼容：https://developer.android.com/build/releases/agp-8-7-0-release-notes\n",
          "app/build.gradle": "plugins { id 'com.android.application' }\nandroid {\n namespace 'cn.lei.sim8051'\n compileSdk 35\n defaultConfig { applicationId 'cn.lei.sim8051'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1' }\n compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }\n}\n",
          "app/src/main/AndroidManifest.xml": "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"><application android:label=\"8051实验台\" android:theme=\"@android:style/Theme.Material.NoActionBar\" android:allowBackup=\"false\" android:supportsRtl=\"true\"><activity android:name=\".MainActivity\" android:exported=\"true\" android:configChanges=\"orientation|screenSize|keyboardHidden\"><intent-filter><action android:name=\"android.intent.action.MAIN\"/><category android:name=\"android.intent.category.LAUNCHER\"/></intent-filter></activity></application></manifest>\n",
          "app/src/main/assets/core.js": "'use strict';\n// Original educational MCS-51 interpreter. Instruction-boundary timing, not bus-cycle simulation.\nclass CPU8051 {\n  constructor(){this.code=new Uint8Array(65536);this.reset();}\n  reset(){this.ram=new Uint8Array(128);this.sfr=new Uint8Array(128);this.xram=new Uint8Array(65536);this.pc=0;this.cycles=0;this.steps=0;this.irq=[];this.sfr[1]=7;for(const p of [0x80,0x90,0xa0,0xb0])this.sfr[p-128]=255;}\n  read(d){if(d>=128&&!CPU8051.sfrs.has(d))throw Error('暂不支持 SFR 0x'+d.toString(16));return d<128?this.ram[d]:this.sfr[d-128];}\n  write(d,v){if(d>=128&&!CPU8051.sfrs.has(d))throw Error('暂不支持 SFR 0x'+d.toString(16));if(d===0x87&&(v&3))throw Error('暂不支持 IDLE/掉电模式');this.raw(d,v);}\n  raw(d,v){if(d<128)this.ram[d]=v&255;else this.sfr[d-128]=v&255;}\n  indirect(d){if(d>127)throw Error('标准 8051 只有 128 字节内部 RAM；请勿选择 8052/STC 扩展内存');return this.ram[d];}\n  putIndirect(d,v){this.indirect(d);this.ram[d]=v&255;}\n  get a(){return this.read(0xe0)} set a(v){this.raw(0xe0,v)}\n  get c(){return this.read(0xd0)>>>7} set c(v){this.flag(7,v)}\n  get dptr(){return this.read(0x83)*256+this.read(0x82)} set dptr(v){this.raw(0x82,v);this.raw(0x83,v>>>8)}\n  flag(n,v){this.raw(0xd0,(this.read(0xd0)&~(1<<n))|(v?1<<n:0))}\n  reg(n){return ((this.read(0xd0)>>>3)&3)*8+n;}\n  r(n){return this.ram[this.reg(n)]} wr(n,v){this.ram[this.reg(n)]=v&255}\n  bit(b){return (this.read(b<128?0x20+(b>>>3):b&0xf8) >>> (b&7))&1}\n  wb(b,v){const d=b<128?0x20+(b>>>3):b&0xf8;this.write(d,(this.read(d)&~(1<<(b&7)))|(v?1<<(b&7):0))}\n  fetch(){const v=this.code[this.pc];this.pc=(this.pc+1)&65535;return v}\n  rel(v){this.pc=(this.pc+(v<128?v:v-256))&65535}\n  push(v){const s=(this.read(0x81)+1)&255;this.putIndirect(s,v);this.raw(0x81,s)}\n  pop(){const s=this.read(0x81),v=this.indirect(s);this.raw(0x81,s-1);return v}\n  call(addr){this.push(this.pc&255);this.push(this.pc>>>8);this.pc=addr}\n  ret(){const h=this.pop();this.pc=(h<<8)|this.pop()}\n  operand(o){const n=o&15;if(n===4)return this.fetch();if(n===5)return this.read(this.fetch());if(n<8)return this.indirect(this.r(n&1));return this.r(n&7)}\n  add(v,carry=0){const a=this.a,s=a+v+carry;this.c=s>255;this.flag(6,((a&15)+(v&15)+carry)>15);this.flag(2,(~(a^v)&(a^s)&128)!==0);this.a=s}\n  sub(v){const a=this.a,c=this.c,s=a-v-c;this.c=s<0;this.flag(6,(a&15)<(v&15)+c);this.flag(2,((a^v)&(a^s)&128)!==0);this.a=s}\n  tick(n){\n    for(let t=0;t<2;t++){\n      const shift=t*4,config=(this.read(0x89)>>>shift)&15,mode=config&3;\n      if(!(this.read(0x88)&(t?64:16)))continue;\n      if(config&12)throw Error('验证版仅支持内部定时：TMOD 的 GATE、C/T 必须为 0');\n      if(mode===3)throw Error('验证版暂不支持定时器模式 3');\n      const lo=0x8a+t,hi=0x8c+t;\n      for(let k=0;k<n;k++){\n        let v,overflow=false;\n        if(mode===2){v=this.read(lo)+1;overflow=v>255;this.raw(lo,overflow?this.read(hi):v)}\n        else if(mode===1){v=(this.read(hi)*256+this.read(lo)+1);overflow=v>65535;this.raw(lo,v);this.raw(hi,v>>>8)}\n        else{v=(this.read(hi)*32+(this.read(lo)&31)+1);overflow=v>8191;this.raw(lo,(this.read(lo)&224)|(v&31));this.raw(hi,v>>>5)}\n        if(overflow)this.raw(0x88,this.read(0x88)|(t?128:32));\n      }\n    }\n    this.cycles+=n;\n  }\n  interrupt(){\n    const ie=this.read(0xa8);if(!(ie&128))return;\n    if(ie&0x15)throw Error('验证版仅实现 T0/T1 中断；请关闭外部中断与串口中断');\n    const current=this.irq.length?this.irq[this.irq.length-1]:-1;\n    for(let priority=1;priority>=0;priority--)for(const [enable,flag,vector] of [[2,32,0x0b],[8,128,0x1b]]){\n      if(priority<=current||!(ie&enable)||!(this.read(0x88)&flag)||Number(!!(this.read(0xb8)&enable))!==priority)continue;\n      this.raw(0x88,this.read(0x88)&~flag);this.irq.push(priority);this.call(vector);this.tick(2);return;\n    }\n  }\n  step(){\n    const address=this.pc,o=this.fetch();let d,v,b,r,n=1;\n    if((o&31)===1){v=this.fetch();this.pc=(this.pc&0xf800)|((o&0xe0)<<3)|v;n=2;}\n    else if((o&31)===17){v=this.fetch();this.call((this.pc&0xf800)|((o&0xe0)<<3)|v);n=2;}\n    else if(o>=0x08&&o<=0x0f)this.wr(o&7,this.r(o&7)+1);\n    else if(o>=0x18&&o<=0x1f)this.wr(o&7,this.r(o&7)-1);\n    else if(o>=0x24&&o<=0x2f)this.add(this.operand(o));\n    else if(o>=0x34&&o<=0x3f)this.add(this.operand(o),this.c);\n    else if(o>=0x44&&o<=0x4f)this.a=this.a|this.operand(o);\n    else if(o>=0x54&&o<=0x5f)this.a=this.a&this.operand(o);\n    else if(o>=0x64&&o<=0x6f)this.a=this.a^this.operand(o);\n    else if(o>=0x78&&o<=0x7f)this.wr(o&7,this.fetch());\n    else if(o>=0x88&&o<=0x8f){d=this.fetch();this.write(d,this.r(o&7));n=2;}\n    else if(o>=0x94&&o<=0x9f)this.sub(this.operand(o));\n    else if(o>=0xa8&&o<=0xaf){this.wr(o&7,this.read(this.fetch()));n=2;}\n    else if(o>=0xb8&&o<=0xbf){v=this.fetch();r=this.fetch();this.c=this.r(o&7)<v;if(this.r(o&7)!==v)this.rel(r);n=2;}\n    else if(o>=0xc8&&o<=0xcf){v=this.r(o&7);this.wr(o&7,this.a);this.a=v;}\n    else if(o>=0xd8&&o<=0xdf){r=this.fetch();this.wr(o&7,this.r(o&7)-1);if(this.r(o&7))this.rel(r);n=2;}\n    else if(o>=0xe8&&o<=0xef)this.a=this.r(o&7);\n    else if(o>=0xf8)this.wr(o&7,this.a);\n    else switch(o){\n      case 0x00:break;\n      case 0x02:v=this.fetch();this.pc=(v<<8)|this.fetch();n=2;break;\n      case 0x03:this.a=(this.a>>>1)|(this.a<<7);break;\n      case 0x04:this.a++;break;\n      case 0x05:d=this.fetch();this.write(d,this.read(d)+1);break;\n      case 0x06:case 0x07:d=this.r(o&1);this.putIndirect(d,this.indirect(d)+1);break;\n      case 0x10:b=this.fetch();r=this.fetch();if(this.bit(b)){this.wb(b,0);this.rel(r)}n=2;break;\n      case 0x12:v=this.fetch();d=(v<<8)|this.fetch();this.call(d);n=2;break;\n      case 0x13:v=this.c;this.c=this.a&1;this.a=(this.a>>>1)|(v<<7);break;\n      case 0x14:this.a--;break;\n      case 0x15:d=this.fetch();this.write(d,this.read(d)-1);break;\n      case 0x16:case 0x17:d=this.r(o&1);this.putIndirect(d,this.indirect(d)-1);break;\n      case 0x20:case 0x30:b=this.fetch();r=this.fetch();if(this.bit(b)===(o===0x20?1:0))this.rel(r);n=2;break;\n      case 0x22:this.ret();n=2;break;\n      case 0x23:this.a=(this.a<<1)|(this.a>>>7);break;\n      case 0x32:this.ret();this.irq.pop();n=2;break;\n      case 0x33:v=this.c;this.c=this.a>>>7;this.a=(this.a<<1)|v;break;\n      case 0x40:case 0x50:r=this.fetch();if(this.c===(o===0x40?1:0))this.rel(r);n=2;break;\n      case 0x42:d=this.fetch();this.write(d,this.read(d)|this.a);break;\n      case 0x43:d=this.fetch();v=this.fetch();this.write(d,this.read(d)|v);n=2;break;\n      case 0x52:d=this.fetch();this.write(d,this.read(d)&this.a);break;\n      case 0x53:d=this.fetch();v=this.fetch();this.write(d,this.read(d)&v);n=2;break;\n      case 0x60:case 0x70:r=this.fetch();if((this.a===0)===(o===0x60))this.rel(r);n=2;break;\n      case 0x62:d=this.fetch();this.write(d,this.read(d)^this.a);break;\n      case 0x63:d=this.fetch();v=this.fetch();this.write(d,this.read(d)^v);n=2;break;\n      case 0x72:this.c=this.c|this.bit(this.fetch());n=2;break;\n      case 0x73:this.pc=(this.dptr+this.a)&65535;n=2;break;\n      case 0x74:this.a=this.fetch();break;\n      case 0x75:d=this.fetch();this.write(d,this.fetch());n=2;break;\n      case 0x76:case 0x77:this.putIndirect(this.r(o&1),this.fetch());break;\n      case 0x80:this.rel(this.fetch());n=2;break;\n      case 0x82:this.c=this.c&this.bit(this.fetch());n=2;break;\n      case 0x83:this.a=this.code[(this.pc+this.a)&65535];n=2;break;\n      case 0x84:v=this.read(0xf0);this.c=0;this.flag(2,v===0);if(v){d=this.a;this.a=Math.floor(d/v);this.raw(0xf0,d%v)}n=4;break;\n      case 0x85:v=this.read(this.fetch());this.write(this.fetch(),v);n=2;break;\n      case 0x86:case 0x87:d=this.fetch();this.write(d,this.indirect(this.r(o&1)));n=2;break;\n      case 0x90:v=this.fetch();this.dptr=(v<<8)|this.fetch();n=2;break;\n      case 0x92:this.wb(this.fetch(),this.c);n=2;break;\n      case 0x93:this.a=this.code[(this.dptr+this.a)&65535];n=2;break;\n      case 0xa0:this.c=this.c|(1-this.bit(this.fetch()));n=2;break;\n      case 0xa2:this.c=this.bit(this.fetch());break;\n      case 0xa3:this.dptr=(this.dptr+1)&65535;n=2;break;\n      case 0xa4:v=this.a*this.read(0xf0);this.a=v;this.raw(0xf0,v>>>8);this.c=0;this.flag(2,v>255);n=4;break;\n      case 0xa6:case 0xa7:this.putIndirect(this.r(o&1),this.read(this.fetch()));n=2;break;\n      case 0xb0:this.c=this.c&(1-this.bit(this.fetch()));n=2;break;\n      case 0xb2:b=this.fetch();this.wb(b,1-this.bit(b));break;\n      case 0xb3:this.c=1-this.c;break;\n      case 0xb4:case 0xb5:case 0xb6:case 0xb7:\n        v=o===0xb5?this.read(this.fetch()):this.fetch();r=this.fetch();d=o<0xb6?this.a:this.indirect(this.r(o&1));this.c=d<v;if(d!==v)this.rel(r);n=2;break;\n      case 0xc0:this.push(this.read(this.fetch()));n=2;break;\n      case 0xc2:this.wb(this.fetch(),0);break;\n      case 0xc3:this.c=0;break;\n      case 0xc4:this.a=(this.a<<4)|(this.a>>>4);break;\n      case 0xc5:d=this.fetch();v=this.read(d);this.write(d,this.a);this.a=v;break;\n      case 0xc6:case 0xc7:d=this.r(o&1);v=this.indirect(d);this.putIndirect(d,this.a);this.a=v;break;\n      case 0xd0:d=this.fetch();v=this.pop();this.write(d,v);n=2;break;\n      case 0xd2:this.wb(this.fetch(),1);break;\n      case 0xd3:this.c=1;break;\n      case 0xd4:v=this.a;b=this.c;if((v&15)>9||(this.read(0xd0)&64))v+=6;if(v>255)b=1;if((v&0xf0)>0x90||b)v+=0x60;this.c=b||v>255;this.a=v;break;\n      case 0xd5:d=this.fetch();r=this.fetch();this.write(d,this.read(d)-1);if(this.read(d))this.rel(r);n=2;break;\n      case 0xd6:case 0xd7:d=this.r(o&1);v=this.indirect(d);b=this.a;this.a=(b&240)|(v&15);this.putIndirect(d,(v&240)|(b&15));break;\n      case 0xe0:this.a=this.xram[this.dptr];n=2;break;\n      case 0xe2:case 0xe3:this.a=this.xram[(this.read(0xa0)<<8)|this.r(o&1)];n=2;break;\n      case 0xe4:this.a=0;break;\n      case 0xe5:this.a=this.read(this.fetch());break;\n      case 0xe6:case 0xe7:this.a=this.indirect(this.r(o&1));break;\n      case 0xf0:this.xram[this.dptr]=this.a;n=2;break;\n      case 0xf2:case 0xf3:this.xram[(this.read(0xa0)<<8)|this.r(o&1)]=this.a;n=2;break;\n      case 0xf4:this.a=this.a^255;break;\n      case 0xf5:this.write(this.fetch(),this.a);break;\n      case 0xf6:case 0xf7:this.putIndirect(this.r(o&1),this.a);break;\n      default:throw Error('不支持/保留操作码 0x'+o.toString(16)+'，PC=0x'+address.toString(16));\n    }\n    this.flag(0,this.a.toString(2).replace(/0/g,'').length%2);this.steps++;this.tick(n);this.interrupt();return n;\n  }\n}\n// UART registers intentionally excluded: fail explicitly instead of pretending serial hardware works.\nCPU8051.sfrs=new Set([0x80,0x81,0x82,0x83,0x87,0x88,0x89,0x8a,0x8b,0x8c,0x8d,0x90,0xa0,0xa8,0xb0,0xb8,0xd0,0xe0,0xf0]);\nfunction parseHex(text){\n const code=new Uint8Array(65536),used=new Uint8Array(65536);code.fill(255);let base=0,end=false,count=0;\n const lines=text.replace(/^\\uFEFF/,'').split(/\\r?\\n/);\n for(let i=0;i<lines.length;i++){\n  const s=lines[i].trim();if(!s)continue;const fail=m=>{throw Error('HEX 第 '+(i+1)+' 行：'+m)};\n  if(end)fail('EOF 之后还有数据');if(!/^:(?:[0-9a-fA-F]{2}){5,}$/.test(s))fail('格式错误');\n  const a=s.slice(1).match(/../g).map(x=>parseInt(x,16)),len=a[0],addr=a[1]*256+a[2],type=a[3];\n  if(a.length!==len+5)fail('长度错误');if(a.reduce((x,y)=>x+y,0)%256)fail('校验和错误');\n  if(type===0){for(let j=0;j<len;j++){const p=base+addr+j;if(p>65535)fail('超出 8051 的 64KB 程序空间');if(used[p]&&code[p]!==a[4+j])fail('地址重叠且数据冲突');if(!used[p])count++;used[p]=1;code[p]=a[4+j]}}\n  else if(type===1){if(len!==0)fail('EOF 长度错误');end=true}\n  else if(type===2||type===4){if(len!==2||addr!==0)fail('扩展地址错误');base=(a[4]*256+a[5])*(type===2?16:65536)}\n  else fail('不支持记录类型 '+type+'；仅接受 8051 HEX，不接受 ARM HEX');\n }\n if(!end)throw Error('HEX 缺少 EOF 结束记录');if(!count)throw Error('HEX 没有程序数据');return {code,count};\n}\nif(typeof module!=='undefined')module.exports={CPU8051,parseHex};\n",
          "app/src/main/assets/demo.js": "const DEMO_HEX=\":0F00000074FEF5907E147FFFDFFEDEFA2380F39F\\n:00000001FF\\n\";\nconst TIMER_HEX=\":100000000200300000000000000000B2903200004A\\n:1000100000000000000000000000000000000000E0\\n:1000200000000000000000000000000000000000D0\\n:1000300075890175A882D28C80FE00000000000046\\n:00000001FF\\n\";\n",
          "app/src/main/assets/index.html": "<!doctype html><html lang=\"zh-CN\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>8051 实验台</title><style>\n:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101820;color:#e6edf4}*{box-sizing:border-box}body{margin:0;padding:22px 18px 38px;max-width:750px;margin:auto}h1{font-size:27px;margin:5px 0}h2{font-size:17px;margin-top:0}.tag{font-size:12px;letter-spacing:2px;color:#6ee7b7}.muted{color:#a6b9c8;font-size:13px;line-height:1.7}.card{background:#1b2935;border:1px solid #334451;border-radius:16px;padding:17px;margin:16px 0}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}button,select{border:1px solid #4b6172;border-radius:10px;background:#253c4c;color:#fff;padding:11px 13px;font-size:14px}button.primary{background:#6ee7b7;color:#122d24;border-color:#6ee7b7;font-weight:700}button:disabled{opacity:.4}select{max-width:100%}.leds{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin:24px 0 12px}.lamp{width:25px;height:25px;border-radius:50%;margin:auto;background:#344c4a;border:2px solid #4c6865}.lamp.on{background:#6ee7b7;border-color:#b2ffe3;box-shadow:0 0 14px #6ee7b770}.pin{text-align:center;font-family:monospace;font-size:11px;color:#afc0ca;margin-top:9px}.chip{padding:13px;text-align:center;letter-spacing:2px;border:2px dashed #547181;border-radius:8px;background:#111e28;color:#bdd0da}#status{font-size:13px;line-height:1.6;overflow-wrap:anywhere;min-height:38px}#regs,#memory{font-family:monospace;font-size:13px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere}.error{color:#ffb4a9}label{font-size:13px}details{margin:15px 0}summary{cursor:pointer}input[type=checkbox]{accent-color:#6ee7b7}#file{display:none}.chipselect{width:100%;margin-top:10px}\n</style></head><body><div class=\"tag\">MCU LAB · 0.1 验证版</div><h1>8051 实验台</h1><div class=\"muted\">把 Keil C51 程序带到手机上运行</div>\n<div class=\"card\"><label>主控芯片</label><select class=\"chipselect\" id=\"chip\"><option>标准 8051 · 128B RAM · 12T</option></select><p class=\"muted\">首版只开放已实现的标准内核；不包含 STC 扩展外设。</p><div class=\"row\"><button class=\"primary\" id=\"import\">导入 HEX</button><button id=\"demo\">流水灯示例</button><button id=\"timerDemo\">定时器示例</button></div><input id=\"file\" type=\"file\" accept=\".hex,text/plain,application/octet-stream\"><p id=\"status\">选择 HEX，或先加载内置示例。</p></div>\n<div class=\"card\"><div class=\"row\"><h2 style=\"margin:0;flex:1\">LED 实验板</h2><select id=\"port\"><option value=\"144\">P1</option><option value=\"128\">P0</option><option value=\"160\">P2</option><option value=\"176\">P3</option></select></div><div class=\"leds\" id=\"leds\"></div><div class=\"chip\">8051 · PORT → 8 × LED</div><p class=\"muted\">固定数字接线，LED 通过限流电阻接 VCC；默认低电平点亮。此页显示端口逻辑值，不模拟模拟电路。</p><label><input type=\"checkbox\" id=\"activeLow\" checked> 低电平点亮</label></div>\n<div class=\"card\"><div class=\"row\"><button id=\"run\" class=\"primary\">运行</button><button id=\"pause\">暂停</button><button id=\"step\">单步</button><button id=\"reset\">复位</button></div><p class=\"muted\">速度为目标机器周期/秒，用于观察；不是手机实时精度保证。</p><select id=\"speed\"><option value=\"1000\">慢速 · 1,000 周期/秒</option><option value=\"50000\" selected>中速 · 50,000 周期/秒</option><option value=\"1000000\">12MHz 晶振目标 · 1,000,000 周期/秒</option></select><pre id=\"regs\"></pre><details><summary>内部 RAM（00–7F）</summary><pre id=\"memory\"></pre></details></div>\n<details><summary>兼容范围与导入说明</summary><p class=\"muted\">Keil C51 → Options for Target → Output → Create HEX File，重新 Build 后导入 .hex。支持基础指令、4 组寄存器、位操作、64KB 程序空间、逻辑 XRAM、定时器 T0/T1 模式 0/1/2 及两级定时器中断。暂不支持 UART、外部中断、外部计数、定时器模式 3、IDLE/掉电、8052/STC 特有功能、AXF 或 Proteus 工程。中断在指令边界处理，尚未做周期精确认证。切到后台自动暂停。HEX 无芯片型号元数据，请自行确认目标型号。</p></details>\n<script src=\"core.js\"></script><script src=\"demo.js\"></script><script src=\"ui.js\"></script></body></html>\n",
          "app/src/main/assets/ui.js": "'use strict';\nconst cpu=new CPU8051(),$=id=>document.getElementById(id);let running=false,loaded=false,last=0,debt=0,fileName='';\nconst hex=(v,n=2)=>v.toString(16).toUpperCase().padStart(n,'0');\nfunction status(t,error=false){$('status').textContent=t;$('status').className=error?'error':''}\nfunction pause(){running=false;render()}\nfunction render(){\n const port=Number($('port').value),p=cpu.read(port),prefix=$('port').selectedOptions[0].text;\n $('leds').innerHTML=Array.from({length:8},(_,i)=>'<div><div class=\"lamp '+((((p>>i)&1)!==Number($('activeLow').checked))?'on':'')+'\"></div><div class=\"pin\">'+prefix+'.'+i+'</div></div>').join('');\n $('regs').textContent=`${running?'运行中':'已暂停'}  PC ${hex(cpu.pc,4)}  指令 ${cpu.steps}\\nA ${hex(cpu.a)}  B ${hex(cpu.read(0xf0))}  PSW ${hex(cpu.read(0xd0))}\\nSP ${hex(cpu.read(0x81))}  DPTR ${hex(cpu.dptr,4)}  CY ${cpu.c}\\n${Array.from({length:8},(_,i)=>'R'+i+' '+hex(cpu.r(i))).join('  ')}\\nP0 ${hex(cpu.read(128))}  P1 ${hex(cpu.read(144))}  P2 ${hex(cpu.read(160))}  P3 ${hex(cpu.read(176))}\\nT0 ${hex(cpu.read(0x8c))}${hex(cpu.read(0x8a))}  T1 ${hex(cpu.read(0x8d))}${hex(cpu.read(0x8b))}\\n机器周期 ${cpu.cycles}`;\n if($('memory').parentElement.open)$('memory').textContent=Array.from({length:8},(_,r)=>hex(r*16)+': '+Array.from(cpu.ram.slice(r*16,r*16+16)).map(x=>hex(x)).join(' ')).join('\\n');\n $('run').disabled=!loaded||running;$('pause').disabled=!running;$('step').disabled=!loaded||running;$('reset').disabled=!loaded;\n}\nwindow.loadHex=(text,name)=>{pause();try{const parsed=parseHex(text);cpu.code.set(parsed.code);cpu.reset();loaded=true;fileName=name;status(name+' · 已加载 '+parsed.count+' 字节');render()}catch(e){status('导入失败：'+e.message+'。原程序保留。',true)}};\nwindow.importError=m=>status(m,true);window.pauseSimulation=pause;\n$('import').onclick=()=>{pause();if(window.Android)Android.pickHex();else $('file').click()};\n$('file').onchange=async e=>{const f=e.target.files[0];if(f){if(f.size>1024*1024)status('文件超过 1MB 上限',true);else loadHex(await f.text(),f.name)}e.target.value=''};\n$('demo').onclick=()=>loadHex(DEMO_HEX,'内置流水灯（手工机器码）');$('timerDemo').onclick=()=>loadHex(TIMER_HEX,'内置 T0 中断闪灯（手工机器码）');\n$('run').onclick=()=>{if(!loaded)return;running=true;last=performance.now();debt=0;status(fileName+' · 运行中');render()};$('pause').onclick=pause;\n$('step').onclick=()=>{try{cpu.step()}catch(e){pause();status(e.message,true)}render()};$('reset').onclick=()=>{pause();cpu.reset();status(fileName+' · 已复位');render()};\n$('port').onchange=render;$('activeLow').onchange=render;document.querySelector('details').ontoggle=render;$('memory').parentElement.ontoggle=render;\nfunction frame(now){if(running){debt+=Math.min(now-last,100)*Number($('speed').value)/1000;const start=performance.now();try{while(debt>0&&performance.now()-start<12){const before=cpu.cycles;cpu.step();debt-=cpu.cycles-before}}catch(e){pause();status(e.message,true)}debt=Math.min(debt,Number($('speed').value)/5);render()}last=now;requestAnimationFrame(frame)}\ndocument.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});render();requestAnimationFrame(frame);\n",
          "app/src/main/java/cn/lei/sim8051/MainActivity.java": "package cn.lei.sim8051;\nimport android.app.Activity;\nimport android.os.Bundle;\nimport android.content.Intent;\nimport android.database.Cursor;\nimport android.provider.OpenableColumns;\nimport android.webkit.*;\nimport android.net.Uri;\nimport java.io.*;\nimport org.json.JSONObject;\npublic class MainActivity extends Activity {\n private WebView web;\n @Override public void onCreate(Bundle state){super.onCreate(state);web=new WebView(this);setContentView(web);web.getSettings().setJavaScriptEnabled(true);web.getSettings().setAllowFileAccess(false);web.getSettings().setAllowContentAccess(false);web.getSettings().setDomStorageEnabled(false);web.setWebViewClient(new WebViewClient(){\n  @Override public WebResourceResponse shouldInterceptRequest(WebView v,WebResourceRequest r){String p=r.getUrl().getPath();if(\"https\".equals(r.getUrl().getScheme())&&\"appassets.androidplatform.net\".equals(r.getUrl().getHost())&&p!=null&&p.matches(\"/[a-zA-Z0-9_.-]+\")){try{return new WebResourceResponse(p.endsWith(\".html\")?\"text/html\":\"text/javascript\",\"UTF-8\",getAssets().open(p.substring(1)));}catch(IOException e){}}\n   return new WebResourceResponse(\"text/plain\",\"UTF-8\",new ByteArrayInputStream(new byte[0]));}\n  @Override public boolean shouldOverrideUrlLoading(WebView v,WebResourceRequest r){return true;}\n });web.addJavascriptInterface(new Bridge(),\"Android\");web.loadUrl(\"https://appassets.androidplatform.net/index.html\");}\n public class Bridge {@JavascriptInterface public void pickHex(){runOnUiThread(()->{Intent i=new Intent(Intent.ACTION_OPEN_DOCUMENT);i.addCategory(Intent.CATEGORY_OPENABLE);i.setType(\"*/*\");startActivityForResult(i,41);});}}\n @Override protected void onActivityResult(int request,int result,Intent data){super.onActivityResult(request,result,data);if(request!=41||result!=RESULT_OK||data==null||data.getData()==null)return;Uri uri=data.getData();new Thread(()->{try{String name=\"program.hex\";try(Cursor c=getContentResolver().query(uri,new String[]{OpenableColumns.DISPLAY_NAME},null,null,null)){if(c!=null&&c.moveToFirst())name=c.getString(0);}ByteArrayOutputStream bytes=new ByteArrayOutputStream();try(InputStream in=getContentResolver().openInputStream(uri)){if(in==null)throw new IOException(\"无法打开文件\");byte[] buffer=new byte[8192];int n;while((n=in.read(buffer))!=-1){if(bytes.size()+n>1048576)throw new IOException(\"文件超过 1MB\");bytes.write(buffer,0,n);}}String js=\"loadHex(\"+JSONObject.quote(bytes.toString(\"UTF-8\"))+\",\"+JSONObject.quote(name)+\")\";runOnUiThread(()->web.evaluateJavascript(js,null));}catch(Exception e){runOnUiThread(()->web.evaluateJavascript(\"importError(\"+JSONObject.quote(\"读取失败：\"+e.getMessage())+\")\",null));}}).start();}\n @Override protected void onPause(){if(web!=null){web.evaluateJavascript(\"window.pauseSimulation&&pauseSimulation()\",null);web.onPause();}super.onPause();}\n @Override protected void onResume(){super.onResume();if(web!=null)web.onResume();}\n @Override protected void onDestroy(){if(web!=null){web.removeJavascriptInterface(\"Android\");web.destroy();}super.onDestroy();}\n}\n",
          "build.gradle": "plugins { id 'com.android.application' version '8.7.3' apply false }\n",
          "examples/keil_led.c": "/* Keil C51; select a standard 8051 with 128-byte IRAM. Enable Create HEX File. */\n#include <REG51.H>\n#include <intrins.h>\nvoid main(void) {\n    unsigned char pattern = 0xFE;\n    volatile unsigned int delay;\n    while (1) {\n        P1 = pattern;\n        for (delay = 0; delay < 30000U; delay++) { _nop_(); }\n        pattern = _crol_(pattern, 1);\n    }\n}\n",
