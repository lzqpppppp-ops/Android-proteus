        print('Generated',len(files),'source files')
        PY_SOURCE
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Verify 8051 interpreter
      run: node _sim8051_generated/tests/core.test.js
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - name: Install Android SDK
      run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'
    - name: Build debug APK
      working-directory: _sim8051_generated
      run: gradle --no-daemon --stacktrace assembleDebug
    - uses: actions/upload-artifact@v4
      with:
        name: 8051-Android-debug
        path: _sim8051_generated/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
    - name: Package source and examples
      run: tar --exclude='*/build' --exclude='*/.gradle' -czf 8051-source-and-examples.tar.gz -C _sim8051_generated .
    - uses: actions/upload-artifact@v4
      with:
        name: 8051-source-and-examples
        path: 8051-source-and-examples.tar.gz
        if-no-files-found: error
